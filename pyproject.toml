[project]
name = "rollcall"
version = "0.1.0"
description = "Credits and discovery database for the game industry — people, games, companies."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "django-environ>=0.14.0",
    "django-htmx>=1.27.0",
    "django-ratelimit>=4.1.0",
    "django-storages[s3]>=1.14.6",
    "duckdb>=1.5.4",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "sentry-sdk>=2.64.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "ruff>=0.15.21",
    "ty>=0.0.58",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["accounts", "games", "contributions", "search", "contact"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "DJ",  # flake8-django
    "ANN", # flake8-annotations — code is fully typed
]
ignore = [
    "ANN401",  # typing.Any is legitimate in *args/**kwargs pass-throughs
]
