name: CI

# No job here writes to the repo; without this the token inherits the org
# default, which is often read+write.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rollcall
          POSTGRES_PASSWORD: rollcall
          POSTGRES_DB: rollcall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rollcall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rollcall:rollcall@localhost:5432/rollcall
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python manage.py check
      - run: uv run pytest

  # A fresh clone must be able to build the production image — this is both
  # the contributor onboarding path (docker compose up) and the deploy path.
  # Broke once, silently: collectstatic imports prod settings, whose required
  # env vars grow over time.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .

  # CONTRIBUTING.md makes the DCO mandatory; without a check it is a rule
  # only a reviewer's eyeball enforces. PRs only — history predates the check.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every PR commit carries a Signed-off-by trailer
        run: |
          set -eu
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for sha in $(git rev-list "$base".."$head" --no-merges); do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .*<.*@.*>'; then
              echo "::error::Commit $sha is missing a Signed-off-by trailer (git commit -s)"
              missing=1
            fi
          done
          exit "$missing"
