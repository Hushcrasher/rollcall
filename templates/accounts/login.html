{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Log in" %} · Rollcall{% endblock %}

{% block content %}
  <h1>{% translate "Log in" %}</h1>

  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% translate "Log in" %}</button>
  </form>

  <p><a href="{% url 'accounts:password_reset' %}">{% translate "Forgot your password?" %}</a></p>
  <p><a href="{% url 'accounts:signup' %}">{% translate "Need an account? Sign up." %}</a></p>
{% endblock %}
