{% load i18n %}
{% for company in companies %}
  <button type="button" class="autocomplete-option"
          data-id="{{ company.pk }}" data-label="{{ company.name }}">
    {{ company.name }}
  </button>
{% empty %}
  <p class="autocomplete-empty">{% translate "No companies found." %}</p>
{% endfor %}

{% if query %}
  <button type="button" class="company-create" data-name="{{ query }}">
    {% blocktranslate %}Not there? Create "{{ query }}"{% endblocktranslate %}
  </button>
{% endif %}
